<script>

const intervalVisualControl = {
  0: { minB: 220, maxB: 255, minS: 0.90, maxS: 1.00 },  // Unison
  1: { minB: 30,  maxB: 70,  minS: 0.20, maxS: 0.35 },  // Minor Second
  2: { minB: 70,  maxB: 110, minS: 0.30, maxS: 0.50 },  // Major Second
  3: { minB: 100, maxB: 130, minS: 0.40, maxS: 0.60 },  // Minor Third
  4: { minB: 110, maxB: 150, minS: 0.45, maxS: 0.65 },  // Major Third
  5: { minB: 140, maxB: 180, minS: 0.55, maxS: 0.75 },  // Perfect Fourth
  6: { minB: 60,  maxB: 90,  minS: 0.25, maxS: 0.40 },  // Tritone
  7: { minB: 200, maxB: 240, minS: 0.85, maxS: 1.00 },  // Perfect Fifth
  8: { minB: 100, maxB: 130, minS: 0.45, maxS: 0.65 },  // Minor Sixth
  9: { minB: 110, maxB: 150, minS: 0.50, maxS: 0.70 },  // Major Sixth
  10:{ minB: 80,  maxB: 120, minS: 0.35, maxS: 0.55 },  // Minor Seventh
  11:{ minB: 60,  maxB: 100, minS: 0.30, maxS: 0.50 }   // Major Seventh
};

const noteToColor = {"A": [255, 50, 10], "A#": [255, 236, 0], "B": [153, 255, 0], "C": [40, 255, 0], "C#": [0, 255, 232], "D": [0, 124, 255], "D#": [5, 0, 255], "E": [69, 0, 234], "F": [85, 0, 79], "F#": [140, 0, 0], "G": [180, 10, 0], "G#": [230, 30, 0]};

function midiToNoteName(midi) {
  const names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const note = names[midi % 12];
  const octave = Math.floor(midi / 12) - 1;
  return note + octave;
}

const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 1500;
canvas.height = 1500;


function blendColorsRaw(colors) {
  let r = colors.reduce((a, c) => a + c[0], 0);
  let g = colors.reduce((a, c) => a + c[1], 0);
  let b = colors.reduce((a, c) => a + c[2], 0);
  return 'rgb(' + Math.min(255, r) + ',' + Math.min(255, g) + ',' + Math.min(255, b) + ')';
}

function blendColors(colors, note1, note2) {
  let r = Math.min(255, colors.reduce((a, c) => a + c[0], 0));
  let g = Math.min(255, colors.reduce((a, c) => a + c[1], 0));
  let b = Math.min(255, colors.reduce((a, c) => a + c[2], 0));


  if (harmonicShadingEnabled) {
    const names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    const idx1 = names.indexOf(note1);
    const idx2 = names.indexOf(note2);
    const interval = Math.abs(idx2 - idx1) % 12;

    const control = intervalVisualControl[interval] || { minB: 0, maxB: 255, minS: 0, maxS: 1 };

    let brightness = 0.299 * r + 0.587 * g + 0.114 * b;
    let brightnessScale = 1;
    if (brightness < control.minB) {
      brightnessScale = control.minB / brightness;
    } else if (brightness > control.maxB) {
      brightnessScale = control.maxB / brightness;
    }
    brightnessScale = 1 + (brightnessScale - 1) * harmonicShadingStrength;
    r *= brightnessScale;
    g *= brightnessScale;
    b *= brightnessScale;

    const maxRGB = Math.max(r, g, b);
    const minRGB = Math.min(r, g, b);
    let saturation = (maxRGB - minRGB) / (maxRGB || 1);
    let targetS = Math.max(control.minS, Math.min(control.maxS, saturation));
    if (saturation !== 0 && saturation !== targetS) {
      const gray = (r + g + b) / 3;
      let ratio = targetS / saturation;
      ratio = 1 + (ratio - 1) * harmonicShadingStrength;
      r = gray + (r - gray) * ratio;
      g = gray + (g - gray) * ratio;
      b = gray + (b - gray) * ratio;
    }
  }

  const names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const idx1 = names.indexOf(note1);
  const idx2 = names.indexOf(note2);
  const interval = Math.abs(idx2 - idx1) % 12;

  const control = intervalVisualControl[interval] || { minB: 0, maxB: 255, minS: 0, maxS: 1 };

  // Perceived brightness
  let brightness = 0.299 * r + 0.587 * g + 0.114 * b;
  let brightnessScale = 1;
  if (brightness < control.minB) {
    brightnessScale = control.minB / brightness;
  } else if (brightness > control.maxB) {
    brightnessScale = control.maxB / brightness;
  }
  brightnessScale = 1 + (brightnessScale - 1) * harmonicShadingStrength;
    r *= brightnessScale;
  g *= brightnessScale;
  b *= brightnessScale;

  // Saturation
  const maxRGB = Math.max(r, g, b);
  const minRGB = Math.min(r, g, b);
  let saturation = (maxRGB - minRGB) / (maxRGB || 1);
  let targetS = Math.max(control.minS, Math.min(control.maxS, saturation));
  if (saturation !== 0 && saturation !== targetS) {
    const gray = (r + g + b) / 3;
    const ratio = targetS / saturation;
    r = gray + (r - gray) * ratio;
    g = gray + (g - gray) * ratio;
    b = gray + (b - gray) * ratio;
  }

  return 'rgb(' + Math.floor(r) + ',' + Math.floor(g) + ',' + Math.floor(b) + ')';
}



let bgBlend = null;
let bgFadeInterval = null;



function updateGridColors() {
  document.querySelectorAll('.cell').forEach(cell => {
    const note1 = cell.dataset.note1;
    const note2 = cell.dataset.note2;
    const color1 = noteToColor[note1];
    const color2 = noteToColor[note2];
    const blend = harmonicShadingEnabled
      ? blendColors([color1, color2], note1, note2)
      : blendColorsRaw([color1, color2]);
    cell.style.backgroundColor = enabledNotes[note1] && enabledNotes[note2] ? blend : '#111';
    cell.dataset.color = blend;
  });
}



function drawCircles() {
  const notes = Array.from(activeNotes.values()).flat();
  const body = document.body;
  if (notes.length === 0) {
    if (!bgFadeInterval) {
      bgFadeInterval = setInterval(() => {
        if (!bgBlend) return;
        const rgb = bgBlend.match(/\d+/g).map(Number);
        const faded = rgb.map(v => Math.floor(v * 0.9));  // fade 10% per frame
        bgBlend = 'rgb(' + faded.join(',') + ')';
        body.style.backgroundColor = bgBlend;
        if (faded.every(v => v < 10)) {
          clearInterval(bgFadeInterval);
          bgFadeInterval = null;
          body.style.backgroundColor = 'black';
        }
      }, 50);
    }
    return;
  }
  if (bgFadeInterval) {
    clearInterval(bgFadeInterval);
    bgFadeInterval = null;
  }
  bgBlend = blendColorsRaw(notes);
  body.style.backgroundColor = bgBlend;
}


const grid = document.getElementById('grid');
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let oscillators = {};
let activeNotes = new Map();

const scMaster = audioCtx.createGain();
scMaster.connect(audioCtx.destination);
const scDelay = audioCtx.createDelay(1.0);
const scDelayWet = audioCtx.createGain();
const scFb = audioCtx.createGain();
scDelay.connect(scFb);
scFb.connect(scDelay);
scDelay.connect(scDelayWet);
scDelayWet.connect(scMaster);
const scConvolver = audioCtx.createConvolver();
const scVerbWet = audioCtx.createGain();
scConvolver.connect(scVerbWet);
scVerbWet.connect(scMaster);
function scNoiseBuffer(seconds) {
  const len = Math.max(1, Math.floor(audioCtx.sampleRate * seconds));
  const buf = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  }
  return buf;
}
scConvolver.buffer = scNoiseBuffer(1.5);
function scPick(panelSel, id) {
  let el = null;
  try { el = document.querySelector(panelSel + ' [id="' + id + '"]'); } catch (_) {}
  return el || document.getElementById(id);
}
function scUpdateFX() {
  const dT = scPick('#panel-delay', 'delayToggle');
  const dTi = scPick('#panel-delay', 'delayTimeControl');
  const dA = scPick('#panel-delay', 'delayAmountControl');
  const dF = scPick('#panel-delay', 'delayFeedbackControl');
  const rT = scPick('#panel-reverb', 'reverbToggle');
  const rA = scPick('#panel-reverb', 'reverbControl');
  const rS = scPick('#panel-reverb', 'roomSizeControl');
  const delayOn = dT ? dT.checked : true;
  const reverbOn = rT ? rT.checked : true;
  scDelay.delayTime.value = dTi ? (parseFloat(dTi.value) || 0.25) : 0.25;
  scDelayWet.gain.value = delayOn ? (dA ? (parseFloat(dA.value) || 0) : 0.4) : 0;
  scFb.gain.value = delayOn ? (dF ? (parseFloat(dF.value) || 0) : 0.3) : 0;
  scVerbWet.gain.value = reverbOn ? (rA ? (parseFloat(rA.value) || 0) : 0.3) : 0;
  const room = rS ? (parseFloat(rS.value) || 0.5) : 0.5;
  if (Math.abs(room - (scUpdateFX._room === undefined ? -1 : scUpdateFX._room)) > 0.01) {
    scUpdateFX._room = room;
    scConvolver.buffer = scNoiseBuffer(0.3 + room * 2.5);
  }
}
try {
  const ids = ['delayToggle','delayTimeControl','delayAmountControl','delayFeedbackControl','reverbToggle','reverbControl','roomSizeControl'];
  ids.forEach(function(id) {
    document.querySelectorAll('input[id="' + id + '"]').forEach(function(el) {
      el.addEventListener('input', scUpdateFX);
    });
  });
} catch (_) {}
scUpdateFX();
window.scProbe = { master: scMaster, delayWet: scDelayWet, verbWet: scVerbWet, delay: scDelay };
function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function playDual(id, midi1, midi2, color1, color2) {
  const note1name = getNoteName(midi1);
  const note2name = getNoteName(midi2);
  if (!enabledNotes[note1name] || !enabledNotes[note2name]) {
    console.log("Note skipped:", note1name, note2name);
    return;
  }
  midi1 += (octaveOffset * 12);

<script>
(function(){
  const btns=Array.from(document.querySelectorAll('#menuBar [data-panel]'));
  function relayout(){if(window.requestRelayout)window.requestRelayout();}
  function closeAll(){document.querySelectorAll('.menuSection.panel').forEach(p=>{p.hidden=true;});btns.forEach(b=>b.classList.remove('active'));}
  btns.forEach(b=>{
    b.addEventListener('click',()=>{
      const p=document.getElementById(b.dataset.panel);
      if(!p)return;
      const wasOpen=!p.hidden;
      closeAll();
      if(!wasOpen){p.hidden=false;b.classList.add('active');}
      relayout();
    });
  });
  document.querySelectorAll('[data-close]').forEach(x=>{
    x.addEventListener('click',()=>{
      const p=x.closest('.menuSection.panel');
      if(p)p.hidden=true;
      const b=p&&document.querySelector('#menuBar [data-panel="'+p.id+'"]');
      if(b)b.classList.remove('active');
      relayout();
    });
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeAll();relayout();}});
})();
</script>

<script>
(function(){
  let nextId=20000;
  const pairs=new Map();
  function A(){try{return window.SpectraAudio||(window.parent&&window.parent.SpectraAudio);}catch(_){return null;}}
  function nativeWave(v){return v||"square";}
  function pushFx(){
    const a=A();if(!a)return;
    const pick=(panel,id)=>{try{return document.querySelector(panel+' [id="'+id+'"]')||document.getElementById(id);}catch(_){return document.getElementById(id);}};
    const dT=pick('#panel-delay','delayToggle'),dTi=pick('#panel-delay','delayTimeControl'),dA=pick('#panel-delay','delayAmountControl'),dF=pick('#panel-delay','delayFeedbackControl');
    const rT=pick('#panel-reverb','reverbToggle'),rA=pick('#panel-reverb','reverbControl'),rS=pick('#panel-reverb','roomSizeControl');
    a.applySpecFX({dlyOn:dT?dT.checked:true,dlyAmt:dA?parseFloat(dA.value)||0:0,dlyFb:dF?parseFloat(dF.value)||0:0,dlyTime:dTi?parseFloat(dTi.value)||.25:.25,
      verbOn:rT?rT.checked:true,verbAmt:rA?parseFloat(rA.value)||0:0,verbRoom:rS?parseFloat(rS.value)||.5:.5});
  }
  playDual=function(id,midi1,midi2,color1,color2){
    const note1name=getNoteName(midi1),note2name=getNoteName(midi2);if(!enabledNotes[note1name]||!enabledNotes[note2name])return;
    midi1+=(octaveOffset*12);midi2+=(octaveOffset*12);
    const a=A();if(!a)return;a.ensure();
    if(pairs.has(id))stopDual(id);
    const id1=nextId++,id2=nextId++;
    const gain=Math.max(0,Math.min(1,parseFloat(document.getElementById('volume').value)||0));
    a.liveSpecStart(id1,midi1,gain,nativeWave(document.getElementById('waveform1').value));
    a.liveSpecStart(id2,midi2,gain,nativeWave(document.getElementById('waveform2').value));

  };

  };

  pushFx();
